<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>攻略三：8月22日 上海周末游路线</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f172a;
  --bg-2: #1e293b;
  --glass: rgba(30, 41, 59, 0.72);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --accent: #818cf8;
  --accent-2: #c084fc;
  --red: #ef4444;
  --orange: #f59e0b;
  --pink: #ec4899;
  --blue: #3b82f6;
  --green: #10b981;
  --purple: #a855f7;
  --teal: #14b8a6;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ===== Layout ===== */
.app {
  display: block;
  height: 100vh;
  width: 100vw;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  height: 100vh;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 28px 24px 24px;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}
.header .badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 6px;
  line-height: 1.3;
}
.header p {
  font-size: 13px;
  opacity: 0.85;
  line-height: 1.5;
}

/* ===== Panels ===== */
.panel {
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin: 12px 16px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.panel h3 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h3 .icon { font-size: 16px; }

/* ===== Legend ===== */
.legend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--text-dim);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}
.legend-line {
  width: 20px; height: 3px;
  margin-right: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ===== Timeline ===== */
.timeline {
  position: relative;
  padding-left: 8px;
}
.tl-item {
  display: flex;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 4px;
  position: relative;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 100%;
  width: 2px;
  height: 4px;
  background: var(--glass-border);
}
.tl-item:last-child::before { display: none; }
.tl-item:hover {
  background: rgba(255,255,255,0.06);
}
.tl-item.active {
  background: rgba(129, 140, 248, 0.15);
  border: 1px solid rgba(129, 140, 248, 0.3);
  padding: 7px 9px;
}
.tl-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  border: 2px solid var(--bg-2);
  box-shadow: 0 0 12px currentColor;
  z-index: 1;
}
.tl-body {
  margin-left: 10px;
  flex: 1;
  min-width: 0;
}
.tl-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.tl-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tl-time {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tl-desc {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  line-height: 1.4;
}

/* ===== Hotels ===== */
.hotel-card {
  display: flex;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.hotel-card:hover {
  background: rgba(20, 184, 166, 0.08);
  border-color: rgba(20, 184, 166, 0.3);
}
.hotel-card:last-child { margin-bottom: 0; }
.hotel-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  border: 2px solid var(--bg-2);
}
.hotel-body {
  margin-left: 10px;
  flex: 1;
  min-width: 0;
}
.hotel-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.hotel-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--teal);
  margin-left: 6px;
}
.hotel-info {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 3px;
  line-height: 1.4;
}

/* ===== Map (mini floating card → expands on click) ===== */
.map-wrap {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 280px;
  height: 200px;
  border-radius: var(--radius);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  overflow: hidden;
  z-index: 1000;
  cursor: pointer;
  transition: width 0.45s cubic-bezier(0.4,0,0.2,1),
               height 0.45s cubic-bezier(0.4,0,0.2,1),
               bottom 0.45s cubic-bezier(0.4,0,0.2,1),
               right 0.45s cubic-bezier(0.4,0,0.2,1),
               border-radius 0.45s;
}
.map-wrap.expanded {
  width: calc(100vw - 32px);
  height: calc(100vh - 32px);
  bottom: 16px;
  right: 16px;
  border-radius: 20px;
  cursor: default;
}
#map {
  width: 100%;
  height: 100%;
  background: var(--bg-2);
}

/* Expand hint overlay (mini mode) */
.map-hint {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  z-index: 1001;
  pointer-events: none;
  transition: opacity 0.3s;
}
.map-hint .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse-dot 1.8s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.map-wrap.expanded .map-hint { opacity: 0; }

/* Close button (expanded mode) */
.map-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text);
  cursor: pointer;
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s 0.2s;
}
.map-close:hover {
  background: rgba(239, 68, 68, 0.6);
  border-color: rgba(239, 68, 68, 0.5);
}
.map-wrap.expanded .map-close {
  opacity: 1;
  pointer-events: auto;
}

/* Bottom padding so sidebar content isn't hidden behind mini map */
.sidebar { padding-bottom: 230px; }

.leaflet-popup-content-wrapper {
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(16px);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.leaflet-popup-content {
  margin: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
}
.leaflet-popup-tip {
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid var(--glass-border);
}
.leaflet-container a.leaflet-popup-close-button {
  color: var(--text-dim);
  font-size: 18px;
  padding: 6px 8px;
}
.leaflet-control-zoom a {
  background: rgba(30, 41, 59, 0.9) !important;
  backdrop-filter: blur(8px);
  color: var(--text) !important;
  border: 1px solid var(--glass-border) !important;
  border-radius: 8px !important;
}
.leaflet-control-zoom a:hover {
  background: rgba(129, 140, 248, 0.3) !important;
}
.leaflet-control-attribution {
  background: rgba(15, 23, 42, 0.7) !important;
  color: var(--text-dim) !important;
  font-size: 10px !important;
  border-radius: 6px 0 0 0;
}
.leaflet-control-attribution a { color: var(--accent) !important; }

/* ===== Custom Markers ===== */
.custom-marker {
  background: transparent !important;
  border: none !important;
}
.marker-pin {
  width: 36px; height: 36px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 16px currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.marker-pin .emoji {
  transform: rotate(45deg);
  font-size: 16px;
  line-height: 1;
}
.marker-pin .time-label {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(8px);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.marker-pin .time-label span {
  display: inline-block;
  transform: rotate(-45deg);
}
.marker-pin.hotel {
  width: 34px; height: 34px;
  border-radius: 50%;
  transform: rotate(0);
  border: 3px solid white;
}
.marker-pin.hotel .emoji {
  transform: rotate(0);
  font-size: 15px;
}
.marker-pin.hotel .time-label { display: none; }

/* ===== Route line ===== */
.route-line {
  filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.5));
}

/* ===== Mobile toggle ===== */
.mobile-tabs {
  display: none;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    max-width: 100%;
    height: 100vh;
  }
  .header {
    padding: 18px 20px 16px;
  }
  .header h1 { font-size: 18px; }
  .header .badge { font-size: 10px; }
  .panel { margin: 10px 12px; padding: 12px 14px; }
  .legend-grid { grid-template-columns: 1fr; }
  .map-wrap {
    width: calc(100vw - 24px);
    height: 180px;
    bottom: 12px;
    right: 12px;
    border-radius: 14px;
  }
  .map-wrap.expanded {
    width: 100vw;
    height: 100vh;
    bottom: 0;
    right: 0;
    border-radius: 0;
  }
  .sidebar { padding-bottom: 200px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <div class="sidebar">
    <!-- Header -->
    <div class="header">
      <div class="badge">攻略三 · 周末游</div>
      <h1>8月22日 上海周末游路线</h1>
      <p>武灼 & 朋友出行 ｜ 北外滩打卡路线<br>自驾停车：白玉兰广场</p>
    </div>

    <!-- Legend -->
    <div class="panel">
      <h3><span class="icon">📍</span>图例</h3>
      <div class="legend-grid">
        <div class="legend-item"><div class="legend-dot" style="background:var(--red);color:var(--red)"></div>起点（停车场）</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--orange);color:var(--orange)"></div>餐厅</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--pink);color:var(--pink)"></div>网红打卡</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--blue);color:var(--blue)"></div>文化景点</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--green);color:var(--green)"></div>滨江 / 夜景</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--purple);color:var(--purple)"></div>电影院</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--teal);color:var(--teal)"></div>酒店</div>
        <div class="legend-item"><div class="legend-line" style="background:linear-gradient(90deg,var(--accent),var(--accent-2))"></div>行进路线</div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="panel">
      <h3><span class="icon">🗺️</span>行程时间线 <span style="font-size:11px;font-weight:400;color:var(--text-dim);margin-left:auto">点击跳转</span></h3>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- Hotels -->
    <div class="panel">
      <h3><span class="icon">🏨</span>推荐酒店</h3>
      <div id="hotel-list"></div>
    </div>

    <!-- Budget summary -->
    <div class="panel">
      <h3><span class="icon">💰</span>预算概览</h3>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>午餐 · 海底捞</span><span style="color:var(--orange);font-weight:600">¥150-200/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>晚餐 · 来福士</span><span style="color:var(--orange);font-weight:600">¥200/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>电影 · IMAX</span><span style="color:var(--purple);font-weight:600">¥80-120/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>酒店 · 如家</span><span style="color:var(--teal);font-weight:600">¥300-380/晚</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:1px solid var(--glass-border);margin-top:4px">
        <span style="font-weight:600">合计（人均）</span><span style="color:var(--accent);font-weight:700">≈ ¥730-900</span>
      </div>
    </div>
  </div>

  <!-- ===== Map (mini → expand on click) ===== -->
  <div class="map-wrap" id="mapWrap">
    <div class="map-hint"><span class="dot"></span>点击查看大地图</div>
    <div class="map-close" id="mapClose">✕</div>
    <div id="map"></div>
  </div>
</div>

<script>
// ===== Data =====
const stops = [
  { name: '白玉兰广场停车场', time: '09:00', lat: 31.2460, lng: 121.5000, color: '#ef4444', icon: '🚗', desc: '自驾停车起点 · 东大名路501号', type: '起点' },
  { name: '海底捞 (星乐汇店)', time: '12:00', lat: 31.2450, lng: 121.4950, color: '#f59e0b', icon: '🍲', desc: '午餐 · 人均¥150-200', type: '餐厅' },
  { name: '新艺花行', time: '13:30', lat: 31.2465, lng: 121.4895, color: '#ec4899', icon: '🌸', desc: '网红花墙打卡 · 南天潼路1号', type: '网红打卡' },
  { name: '上海邮政博物馆', time: '14:15', lat: 31.2460, lng: 121.4850, color: '#3b82f6', icon: '🏛️', desc: '免费参观 · 欧式建筑+苏州河景', type: '文化景点' },
  { name: '北外滩滨江步道', time: '15:00', lat: 31.2520, lng: 121.4950, color: '#10b981', icon: '🌊', desc: '江景漫步 · 看陆家嘴天际线', type: '滨江' },
  { name: '寰映影城 (太阳宫)', time: '16:00', lat: 31.2650, lng: 121.4850, color: '#a855f7', icon: '🎬', desc: 'IMAX《奥德赛》172分钟', type: '电影院' },
  { name: '北外滩来福士', time: '18:50', lat: 31.2500, lng: 121.4920, color: '#f59e0b', icon: '🍽️', desc: '晚餐 · 人均¥200（备选：瑞虹太阳宫）', type: '餐厅' },
  { name: '北外滩夜景', time: '20:00', lat: 31.2510, lng: 121.4940, color: '#10b981', icon: '✨', desc: '"小巨蛋"银色球体打卡', type: '夜景' },
];

const hotels = [
  { name: '如家（外白渡桥四川北路店）', lat: 31.2430, lng: 121.4870, color: '#14b8a6', icon: '🏨', desc: '首推 · ¥300-380 · 9.5分', addr: '四川北路818号', tag: '首推' },
  { name: '莫泰（天潼路店）', lat: 31.2455, lng: 121.4880, color: '#2dd4bf', icon: '🏨', desc: '备选1 · ¥250-320 · 步行5分钟', addr: '天潼路321号', tag: '备选' },
  { name: '如家商旅（北外滩店）', lat: 31.2470, lng: 121.4960, color: '#5eead4', icon: '🏨', desc: '备选2 · ¥280-350 · 近白玉兰', addr: '东大名路959号', tag: '备选' },
];

// ===== Init Map =====
const map = L.map('map', {
  center: [31.248, 121.490],
  zoom: 15,
  zoomControl: true,
  scrollWheelZoom: true,
  attributionControl: true,
});

// Dark theme tile layer (CartoDB Dark Matter)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap · © CartoDB',
  maxZoom: 19,
  subdomains: 'abcd',
}).addTo(map);

// ===== Route Polyline =====
const routePoints = stops.map(s => [s.lat, s.lng]);
const routeLine = L.polyline(routePoints, {
  color: '#818cf8',
  weight: 3,
  opacity: 0.7,
  dashArray: '10, 8',
  smoothFactor: 1,
  className: 'route-line',
}).addTo(map);

// ===== Stop Markers =====
const stopMarkers = [];
stops.forEach((stop, idx) => {
  const markerHtml = `
    <div style="position:relative;color:${stop.color}">
      <div class="marker-pin" style="background:${stop.color};color:${stop.color}">
        <div class="emoji">${stop.icon}</div>
        <div class="time-label"><span>${stop.time}</span></div>
      </div>
    </div>
  `;
  const icon = L.divIcon({
    html: markerHtml,
    className: 'custom-marker',
    iconSize: [36, 48],
    iconAnchor: [18, 48],
  });
  const marker = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div style="text-align:center;min-width:160px;">
      <div style="font-size:28px;margin-bottom:4px;">${stop.icon}</div>
      <div style="font-weight:700;font-size:14px;color:#f1f5f9;">${stop.name}</div>
      <div style="margin:4px 0;">
        <span style="display:inline-block;background:${stop.color};color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;">${stop.type}</span>
      </div>
      <div style="color:#818cf8;font-weight:700;font-size:13px;">${stop.time} 到达</div>
      <div style="color:#94a3b8;font-size:12px;margin-top:6px;line-height:1.4;">${stop.desc}</div>
      <div style="color:#64748b;font-size:11px;margin-top:6px;">第 ${idx + 1} 站 / 共 ${stops.length} 站</div>
    </div>
  `, { maxWidth: 250 });
  stopMarkers.push(marker);
});

// ===== Hotel Markers =====
const hotelMarkers = [];
hotels.forEach((hotel) => {
  const markerHtml = `
    <div style="color:${hotel.color}">
      <div class="marker-pin hotel" style="background:${hotel.color};color:${hotel.color}">
        <div class="emoji">${hotel.icon}</div>
      </div>
    </div>
  `;
  const icon = L.divIcon({
    html: markerHtml,
    className: 'custom-marker',
    iconSize: [34, 34],
    iconAnchor: [17, 17],
  });
  const marker = L.marker([hotel.lat, hotel.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div style="text-align:center;min-width:160px;">
      <div style="font-size:24px;margin-bottom:4px;">${hotel.icon}</div>
      <div style="font-weight:700;font-size:14px;color:#f1f5f9;">${hotel.name}</div>
      <div style="color:#14b8a6;font-weight:600;font-size:12px;margin-top:4px;">${hotel.desc}</div>
      <div style="color:#94a3b8;font-size:12px;margin-top:4px;">${hotel.addr}</div>
    </div>
  `, { maxWidth: 250 });
  hotelMarkers.push(marker);
});

// Fit bounds
map.fitBounds(routePoints, { padding: [60, 60] });

// ===== Timeline (sidebar) =====
const tl = document.getElementById('timeline');
stops.forEach((stop, idx) => {
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.innerHTML = `
    <div class="tl-dot" style="background:${stop.color};color:${stop.color}">${stop.icon}</div>
    <div class="tl-body">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="tl-name">${stop.name}</div>
        <div class="tl-time">${stop.time}</div>
      </div>
      <div class="tl-desc">${stop.desc}</div>
    </div>
  `;
  item.addEventListener('click', () => {
    // Highlight active
    document.querySelectorAll('.tl-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    // Expand map first, then fly
    expandMap();
    setTimeout(() => {
      map.flyTo([stop.lat, stop.lng], 17, { duration: 1.2 });
      setTimeout(() => stopMarkers[idx].openPopup(), 600);
    }, 500);
  });
  tl.appendChild(item);
});

// ===== Hotel list (sidebar) =====
const hl = document.getElementById('hotel-list');
hotels.forEach((hotel, idx) => {
  const card = document.createElement('div');
  card.className = 'hotel-card';
  card.innerHTML = `
    <div class="hotel-dot" style="background:${hotel.color};color:${hotel.color}">${hotel.icon}</div>
    <div class="hotel-body">
      <div class="hotel-name">${hotel.name}<span class="hotel-tag">${hotel.tag}</span></div>
      <div class="hotel-info">${hotel.desc}<br>${hotel.addr}</div>
    </div>
  `;
  card.addEventListener('click', () => {
    expandMap();
    setTimeout(() => {
      map.flyTo([hotel.lat, hotel.lng], 17, { duration: 1.2 });
      setTimeout(() => hotelMarkers[idx].openPopup(), 600);
    }, 500);
  });
  hl.appendChild(card);
});

// ===== Map expand / collapse =====
const mapWrap = document.getElementById('mapWrap');
const mapClose = document.getElementById('mapClose');
let isExpanded = false;

function expandMap() {
  if (isExpanded) return;
  isExpanded = true;
  mapWrap.classList.add('expanded');
  // Leaflet needs invalidateSize after the transition starts
  setTimeout(() => map.invalidateSize(), 100);
  setTimeout(() => map.invalidateSize(), 500);
}

function collapseMap() {
  isExpanded = false;
  mapWrap.classList.remove('expanded');
  setTimeout(() => map.invalidateSize(), 100);
  setTimeout(() => map.invalidateSize(), 500);
}

// Click mini map to expand (but not when clicking close button or markers)
mapWrap.addEventListener('click', (e) => {
  if (isExpanded) return;
  // Don't expand if clicking on a Leaflet marker/popup element
  if (e.target.closest('.leaflet-marker-icon') || e.target.closest('.leaflet-popup')) return;
  expandMap();
});

mapClose.addEventListener('click', (e) => {
  e.stopPropagation();
  collapseMap();
});
</script>
</body>
</html>
