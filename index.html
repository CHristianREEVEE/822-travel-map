<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末游玩地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f172a;
  --bg-2: #1e293b;
  --glass: rgba(30, 41, 59, 0.72);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --accent: #818cf8;
  --accent-2: #c084fc;
  --red: #ef4444;
  --orange: #f59e0b;
  --pink: #ec4899;
  --blue: #3b82f6;
  --green: #10b981;
  --purple: #a855f7;
  --teal: #14b8a6;
  --cyan: #06b6d4;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ===== Layout ===== */
.app {
  display: block;
  height: 100vh;
  width: 100vw;
}

/* ===== Sidebar ===== */
.sidebar {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  height: 100vh;
  scrollbar-width: thin;
  scrollbar-color: var(--accent) transparent;
  padding-bottom: 140px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header .title-bar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 8px 24px;
  font-size: 17px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 2px;
}

/* ===== Panels ===== */
.panel {
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin: 12px 16px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.panel h3 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h3 .icon { font-size: 16px; }

/* ===== Legend ===== */
.legend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--text-dim);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}
.legend-line {
  width: 20px; height: 3px;
  margin-right: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ===== Timeline ===== */
.timeline {
  position: relative;
  padding-left: 8px;
}
.tl-item {
  display: flex;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 4px;
  position: relative;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 19px;
  top: 100%;
  width: 2px;
  height: 4px;
  background: var(--glass-border);
}
.tl-item:last-child::before { display: none; }
.tl-item:hover {
  background: rgba(255,255,255,0.06);
}
.tl-item.active {
  background: rgba(129, 140, 248, 0.15);
  border: 1px solid rgba(129, 140, 248, 0.3);
  padding: 7px 9px;
}
.tl-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  border: 2px solid var(--bg-2);
  box-shadow: 0 0 12px currentColor;
  z-index: 1;
  position: relative;
}
.tl-step {
  position: absolute;
  top: -6px; right: -6px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 9px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--bg);
  z-index: 2;
}
.tl-body {
  margin-left: 10px;
  flex: 1;
  min-width: 0;
}
.tl-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.tl-transport {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(129, 140, 248, 0.12);
  padding: 2px 8px;
  border-radius: 8px;
  margin-top: 4px;
}
.tl-desc {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 3px;
  line-height: 1.4;
}

/* ===== Hotels ===== */
.hotel-card {
  display: flex;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--glass-border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.hotel-card:hover {
  background: rgba(20, 184, 166, 0.08);
  border-color: rgba(20, 184, 166, 0.3);
}
.hotel-card:last-child { margin-bottom: 0; }
.hotel-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  border: 2px solid var(--bg-2);
}
.hotel-body {
  margin-left: 10px;
  flex: 1;
  min-width: 0;
}
.hotel-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.hotel-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--teal);
  margin-left: 6px;
}
.hotel-info {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 3px;
  line-height: 1.4;
}

/* ===== Map (mini floating card → expands on click) ===== */
.map-wrap {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 280px;
  height: 200px;
  border-radius: var(--radius);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  overflow: hidden;
  z-index: 1000;
  cursor: pointer;
  transition: width 0.45s cubic-bezier(0.4,0,0.2,1),
               height 0.45s cubic-bezier(0.4,0,0.2,1),
               bottom 0.45s cubic-bezier(0.4,0,0.2,1),
               right 0.45s cubic-bezier(0.4,0,0.2,1),
               border-radius 0.45s;
}
.map-wrap.expanded {
  width: calc(100vw - 32px);
  height: calc(100vh - 32px);
  bottom: 16px;
  right: 16px;
  border-radius: 20px;
  cursor: default;
}
#map {
  width: 100%;
  height: 100%;
  background: #e8e8e8;
}

/* ===== Onboarding overlay (fixed center on screen) ===== */
.map-onboard {
  position: fixed;
  inset: 0;
  z-index: 1002;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.3);
  opacity: 1;
  transition: opacity 0.3s;
  cursor: default;
}
.map-onboard.hidden {
  opacity: 0;
  pointer-events: none;
}
.onboard-card {
  position: relative;
  background: rgba(30, 41, 59, 0.95);
  border: 1px solid rgba(129, 140, 248, 0.3);
  border-radius: 16px;
  padding: 32px 40px 28px;
  text-align: center;
  max-width: 280px;
  box-shadow: 0 8px 40px rgba(129, 140, 248, 0.15), 0 4px 16px rgba(0,0,0,0.5);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 8px 40px rgba(129, 140, 248, 0.15), 0 4px 16px rgba(0,0,0,0.5); }
  50% { box-shadow: 0 8px 50px rgba(129, 140, 248, 0.35), 0 4px 16px rgba(0,0,0,0.5); }
}
.onboard-card .icon-big {
  font-size: 36px;
  margin-bottom: 12px;
}
.onboard-card .text {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.6;
}
.onboard-card .text span {
  color: var(--accent);
  font-weight: 700;
}
.onboard-close {
  position: absolute;
  top: -16px;
  right: -16px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #ef4444;
  border: 3px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
  z-index: 1003;
  box-shadow: 0 4px 20px rgba(239,68,68,0.6);
  transition: transform 0.15s, box-shadow 0.15s;
}
.onboard-close:hover {
  transform: scale(1.15);
  box-shadow: 0 6px 28px rgba(239,68,68,0.8);
}

/* Close button (expanded mode) */
.map-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text);
  cursor: pointer;
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s 0.2s;
}
.map-close:hover {
  background: rgba(239, 68, 68, 0.6);
  border-color: rgba(239, 68, 68, 0.5);
}
.map-wrap.expanded .map-close {
  opacity: 1;
  pointer-events: auto;
}

/* Tip bar (expanded mode only) */
.map-tip-bar {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.45);
  color: rgba(241, 245, 249, 0.7);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 16px;
  border-radius: 16px;
  z-index: 1001;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s 0.3s;
  white-space: nowrap;
}
.map-wrap.expanded .map-tip-bar {
  opacity: 1;
}

.leaflet-popup-content-wrapper {
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(16px);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.leaflet-popup-content {
  margin: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
}
.leaflet-popup-tip {
  background: rgba(15, 23, 42, 0.92);
  border: 1px solid var(--glass-border);
}
.leaflet-container a.leaflet-popup-close-button {
  color: var(--text-dim);
  font-size: 18px;
  padding: 6px 8px;
}
.leaflet-control-zoom a {
  background: rgba(30, 41, 59, 0.9) !important;
  backdrop-filter: blur(8px);
  color: var(--text) !important;
  border: 1px solid var(--glass-border) !important;
  border-radius: 8px !important;
}
.leaflet-control-zoom a:hover {
  background: rgba(129, 140, 248, 0.3) !important;
}
.leaflet-control-attribution {
  background: rgba(15, 23, 42, 0.7) !important;
  color: var(--text-dim) !important;
  font-size: 10px !important;
  border-radius: 6px 0 0 0;
}
.leaflet-control-attribution a { color: var(--accent) !important; }

/* ===== Custom Markers ===== */
.custom-marker {
  background: transparent !important;
  border: none !important;
}
.marker-pin {
  width: 36px; height: 36px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid white;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5), 0 0 16px currentColor;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.marker-pin .emoji {
  transform: rotate(45deg);
  font-size: 16px;
  line-height: 1;
}
.step-badge {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #0f172a;
  border: 2.5px solid #fff;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  line-height: 1;
  font-family: system-ui, sans-serif;
}
.marker-pin.hotel {
  width: 34px; height: 34px;
  border-radius: 50%;
  transform: rotate(0);
  border: 3px solid white;
}
.marker-pin.hotel .emoji {
  transform: rotate(0);
  font-size: 15px;
}

/* ===== Route line ===== */
.route-line {
  filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.5));
}
.ferry-line {
  filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    max-width: 100%;
    height: 100vh;
    padding-bottom: 220px;
  }
  .header {
    padding: 18px 20px 16px;
  }
  .header h1 { font-size: 18px; }
  .header .badge { font-size: 10px; }
  .panel { margin: 10px 12px; padding: 12px 14px; }
  .legend-grid { grid-template-columns: 1fr 1fr; }
  .map-wrap {
    width: calc(100vw - 24px);
    height: 200px;
    bottom: 12px;
    right: 12px;
    border-radius: 14px;
  }
  .map-wrap.expanded {
    width: 100vw;
    height: 100vh;
    bottom: 0;
    right: 0;
    border-radius: 0;
  }
  .onboard-card {
    max-width: 240px;
    padding: 24px 28px 20px;
  }
  .onboard-card .text { font-size: 14px; }
  .leaflet-popup-content { font-size: 12px; margin: 10px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <div class="sidebar">
    <!-- Header -->
    <div class="header">
      <div class="title-bar">🗺️ 8.22 游玩地图</div>
    </div>

    <!-- Legend -->
    <div class="panel">
      <h3><span class="icon">📍</span>图例</h3>
      <div class="legend-grid">
        <div class="legend-item"><div class="legend-dot" style="background:var(--red);color:var(--red)"></div>起点 / 接人</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--teal);color:var(--teal)"></div>酒店</div>

      <h3><span class="icon">🗺️</span>途经站点 <span style="font-size:11px;font-weight:400;color:var(--text-dim);margin-left:auto">点击跳转</span></h3>

    <div class="panel">
      <h3><span class="icon">💰</span>预算概览</h3>

        <span>高铁 · 绍兴北→虹桥</span><span style="color:var(--accent);font-weight:600">¥111/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>午餐 · 海底捞</span><span style="color:var(--orange);font-weight:600">¥150-200/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>轮渡 · 泰公线</span><span style="color:var(--cyan);font-weight:600">¥2/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>电影 · IMAX</span><span style="color:var(--purple);font-weight:600">¥80-120/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>晚餐 · 来福士</span><span style="color:var(--orange);font-weight:600">¥200/人</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:6px">
        <span>酒店 · 华住海友/汉庭</span><span style="color:var(--teal);font-weight:600">¥150-220/晚</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding-top:8px;border-top:1px solid var(--glass-border);margin-top:4px">
        <span style="font-weight:600">合计（人均）</span><span style="color:var(--accent);font-weight:700">≈ ¥593-655</span>
      </div>
    </div>
  </div>

  <!-- ===== Map (mini → expand on click) ===== -->
  <div class="map-wrap" id="mapWrap">
    <div class="map-onboard" id="mapOnboard">
      <div class="onboard-card">
        <div class="onboard-close" id="onboardClose">✕</div>
        <div class="icon-big">🗺️</div>
        <div class="text">点击右下角<span>小地图</span><br>可全屏查看地图</div>
      </div>

    <div class="map-close" id="mapClose">✕</div>
    <div class="map-tip-bar" id="mapTipBar">👆 点击序号图标可查看具体行程</div>

<script>
// ===== WGS84 → GCJ-02 coordinate conversion =====
function wgs84ToGcj02(lng, lat) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  let dLat = ((lng, lat) => { let ret = -100 + 2*lng - 3*lat + 0.2*lat*lat + 0.1*lng*lat + 0.2*Math.sqrt(Math.abs(lng)); ret += (20*Math.sin(6*lng*Math.PI) + 20*Math.sin(2*lng*Math.PI)) * 2/3; ret += (20*Math.sin(lat*Math.PI) + 40*Math.sin(lat/3*Math.PI)) * 2/3; ret += (160*Math.sin(lat/12*Math.PI) + 320*Math.sin(lat*Math.PI/30)) * 2/3; return ret; })(lng, lat);
  let dLng = ((lng, lat) => { let ret = 300 + lng + 2*lat + 0.1*lng*lng + 0.1*lng*lat + 0.1*Math.sqrt(Math.abs(lng)); ret += (20*Math.sin(6*lng*Math.PI) + 20*Math.sin(2*lng*Math.PI)) * 2/3; ret += (20*Math.sin(lng*Math.PI) + 40*Math.sin(lng/3*Math.PI)) * 2/3; ret += (150*Math.sin(lng/12*Math.PI) + 300*Math.sin(lng/30*Math.PI)) * 2/3; return ret; })(lng, lat);
  const radLat = lat / 180 * Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lng + dLng, lat + dLat];
}

// ===== Data =====
const stops = [
  { name: '虹桥火车站', lat: 31.1942, lng: 121.3194, color: '#ef4444', icon: '🚗', desc: '接朋友 · 高铁绍兴北→虹桥约1.5h', type: '起点', transport: '🚗 自驾出发' },
  { name: '酒店入住', lat: 31.2455, lng: 121.4880, color: '#14b8a6', icon: '🏨', desc: '办理入住 · 放行李 · 华住会APP预订', type: '酒店', transport: '🚗 自驾约40min' },
  { name: '白玉兰广场', lat: 31.2460, lng: 121.5000, color: '#ef4444', icon: '🅿️', desc: '停车 · 东大名路501号 · 开始逛', type: '停车起点', transport: '🚗 自驾约10min' },
  { name: '海底捞 (星乐汇店)', lat: 31.2450, lng: 121.4950, color: '#f59e0b', icon: '🍲', desc: '午餐 · 人均¥150-200', type: '餐厅', transport: '🚶 步行10min' },
  { name: '新艺花行', lat: 31.2465, lng: 121.4895, color: '#ec4899', icon: '🌸', desc: '网红花墙打卡 · 南天潼路1号', type: '网红打卡', transport: '🚶 步行8min' },
  { name: '上海邮政博物馆', lat: 31.2460, lng: 121.4850, color: '#3b82f6', icon: '🏛️', desc: '免费参观 · 欧式建筑+苏州河景', type: '文化景点', transport: '🚶 步行5min' },
  { name: '北外滩滨江步道', lat: 31.2520, lng: 121.4950, color: '#10b981', icon: '🌊', desc: '江景漫步 · 看陆家嘴天际线', type: '滨江', transport: '🚶 步行10min' },
  { name: '公平路渡口 → 泰同栈渡口', lat: 31.2495, lng: 121.5050, color: '#06b6d4', icon: '⛴️', desc: '2元轮渡横渡黄浦江 · 看两岸天际线 · 支付宝扫码', type: '2元轮渡', transport: '🚶 步行到公平路渡口' },
  { name: '寰映影城 (太阳宫)', lat: 31.2650, lng: 121.4850, color: '#a855f7', icon: '🎬', desc: 'IMAX《奥德赛》172分钟', type: '电影院', transport: '⛴️ 轮渡返回 + 🚇 地铁' },
  { name: '北外滩来福士', lat: 31.2500, lng: 121.4920, color: '#f59e0b', icon: '🍽️', desc: '晚餐 · 人均¥200（备选：瑞虹太阳宫）', type: '餐厅', transport: '🚇 地铁/🚕 打车' },
  { name: '北外滩夜景', lat: 31.2510, lng: 121.4940, color: '#10b981', icon: '✨', desc: '"小巨蛋"银色球体打卡', type: '夜景', transport: '🚶 步行' },
];

// Ferry crossing route (separate line on map)
const ferryRoute = [
  [31.2495, 121.5050],  // 公平路渡口 (浦西)
  [31.2495, 121.5130],  // 泰同栈渡口 (浦东)
];

const hotels = [
  { name: '海友酒店（北外滩店）', lat: 31.2455, lng: 121.4880, color: '#14b8a6', icon: '🏨', desc: '华住旗下 · ¥150-200 · 性价比之王', addr: '东大名路附近 · 步行5min到天潼路站', tag: '首推' },
  { name: '汉庭优佳（北外滩大连路店）', lat: 31.2510, lng: 121.4900, color: '#2dd4bf', icon: '🏨', desc: '华住旗下 · ¥180-220 · 地铁4号线', addr: '周家嘴路1063弄 · 步行5min到大连路站', tag: '备选1' },
  { name: '汉庭（外滩外白渡桥店）', lat: 31.2430, lng: 121.4870, color: '#5eead4', icon: '🏨', desc: '华住旗下 · ¥200-250 · 外白渡桥旁', addr: '黄浦路200号A · 步行3min到北外滩', tag: '备选2' },
];

// ===== Convert all WGS84 coords to GCJ-02 in-place =====
stops.forEach(s => { const [gLng, gLat] = wgs84ToGcj02(s.lng, s.lat); s.lng = gLng; s.lat = gLat; });
hotels.forEach(h => { const [gLng, gLat] = wgs84ToGcj02(h.lng, h.lat); h.lng = gLng; h.lat = gLat; });
ferryRoute.forEach((p, i) => { const [gLng, gLat] = wgs84ToGcj02(p[1], p[0]); ferryRoute[i] = [gLat, gLng]; });

// ===== Init Map =====
const map = L.map('map', {
  center: wgs84ToGcj02(121.430, 31.235).reverse(),
  zoom: 13,
  zoomControl: true,
  scrollWheelZoom: true,
  attributionControl: true,
});

// 高德地图中文瓦片
const tileLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
  attribution: '高德地图',
  maxZoom: 19,
  subdomains: ['1','2','3','4'],
  crossOrigin: true,
}).addTo(map);

// 瓦片加载指示器
const mapLoading = document.createElement('div');
mapLoading.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:500;background:rgba(30,41,59,0.85);color:#e2e8f0;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;backdrop-filter:blur(8px);border:1px solid rgba(129,140,248,0.3);pointer-events:none;transition:opacity 0.4s;';
mapLoading.textContent = '🗺️ 地图加载中…';
document.getElementById('map').appendChild(mapLoading);

let _tilesTotal = 0, _tilesLoaded = 0;
tileLayer.on('tileloadstart', () => _tilesTotal++);
tileLayer.on('tileload tileerror', () => {
  _tilesLoaded++;
  if (_tilesLoaded >= _tilesTotal) {
    mapLoading.style.opacity = '0';
    setTimeout(() => mapLoading.remove(), 400);
  }
});

// ===== Ferry Route Line (cyan dashed) =====
L.polyline(ferryRoute, {
  color: '#06b6d4',
  weight: 4,
  opacity: 0.8,
  dashArray: '6, 10',
  smoothFactor: 1,
  className: 'ferry-line',
}).addTo(map);

// ===== Route Polyline =====
const routePoints = stops.map(s => [s.lat, s.lng]);
const routeLine = L.polyline(routePoints, {
  color: '#818cf8',
  weight: 3,
  opacity: 0.7,
  dashArray: '10, 8',
  smoothFactor: 1,
  className: 'route-line',
}).addTo(map);

// ===== Stop Markers =====
const stopMarkers = [];
stops.forEach((stop, idx) => {
  const markerHtml = `
    <div style="position:relative;color:${stop.color}">
      <div class="step-badge">${idx + 1}</div>
      <div class="marker-pin" style="background:${stop.color};color:${stop.color}">
        <div class="emoji">${stop.icon}</div>
      </div>
    </div>
  `;
  const icon = L.divIcon({
    html: markerHtml,
    className: 'custom-marker',
    iconSize: [36, 48],
    iconAnchor: [18, 48],
  });
  const marker = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div style="text-align:center;min-width:180px;">
      <div style="font-size:28px;margin-bottom:4px;">${stop.icon}</div>
      <div style="font-weight:700;font-size:14px;color:#f1f5f9;">${stop.name}</div>
      <div style="margin:4px 0;">
        <span style="display:inline-block;background:${stop.color};color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;">${stop.type}</span>
      </div>
      <div style="color:#818cf8;font-weight:700;font-size:13px;">第 ${idx + 1} 站 / 共 ${stops.length} 站</div>
      <div style="color:#94a3b8;font-size:12px;margin-top:6px;line-height:1.4;">${stop.desc}</div>
      <div style="margin-top:8px;padding:4px 8px;background:rgba(129,140,248,0.15);border-radius:8px;color:#818cf8;font-size:12px;font-weight:600;">${stop.transport}</div>
      <div style="display:flex;gap:6px;margin-top:10px;">
        <button onclick="goStop(${idx - 1})" style="flex:1;padding:6px 12px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(30,41,59,0.8);color:#f1f5f9;font-size:12px;font-weight:600;cursor:pointer;${idx === 0 ? 'opacity:0.4;pointer-events:none;' : ''}">← 上一站</button>
        <button onclick="goStop(${idx + 1})" style="flex:1;padding:6px 12px;border:1px solid rgba(129,140,248,0.4);border-radius:8px;background:rgba(129,140,248,0.2);color:#818cf8;font-size:12px;font-weight:600;cursor:pointer;${idx === stops.length - 1 ? 'opacity:0.4;pointer-events:none;' : ''}">下一站 →</button>
      </div>
    </div>
  `, { maxWidth: 280 });
  stopMarkers.push(marker);
});

// ===== Navigation: go to stop by index =====
function goStop(i) {
  if (i < 0 || i >= stops.length) return;
  map.flyTo([stops[i].lat, stops[i].lng], 16, { duration: 1.0 });
  setTimeout(() => stopMarkers[i].openPopup(), 700);
}
window.goStop = goStop;

// ===== Hotel Markers =====
const hotelMarkers = [];
hotels.forEach((hotel) => {
  const markerHtml = `
    <div style="color:${hotel.color}">
      <div class="marker-pin hotel" style="background:${hotel.color};color:${hotel.color}">
        <div class="emoji">${hotel.icon}</div>
      </div>
    </div>
  `;
  const icon = L.divIcon({
    html: markerHtml,
    className: 'custom-marker',
    iconSize: [34, 34],
    iconAnchor: [17, 17],
  });
  const marker = L.marker([hotel.lat, hotel.lng], { icon }).addTo(map);
  marker.bindPopup(`
    <div style="text-align:center;min-width:180px;">
      <div style="font-size:24px;margin-bottom:4px;">${hotel.icon}</div>
      <div style="font-weight:700;font-size:14px;color:#f1f5f9;">${hotel.name}</div>
      <div style="color:#14b8a6;font-weight:600;font-size:12px;margin-top:4px;">${hotel.desc}</div>
      <div style="color:#94a3b8;font-size:12px;margin-top:4px;">${hotel.addr}</div>
    </div>
  `, { maxWidth: 280 });
  hotelMarkers.push(marker);
});

// Fit bounds (include all stops + ferry endpoint)
const allPoints = [...routePoints, ...ferryRoute];
map.fitBounds(allPoints, { padding: [60, 60] });

// ===== Timeline (sidebar) =====
const tl = document.getElementById('timeline');
stops.forEach((stop, idx) => {
  const item = document.createElement('div');
  item.className = 'tl-item';
  item.innerHTML = `
    <div style="position:relative;">
      <div class="tl-dot" style="background:${stop.color};color:${stop.color}">${stop.icon}</div>
      <div class="tl-step">${idx + 1}</div>
    </div>
    <div class="tl-body">
      <div class="tl-name">${stop.name}</div>
      <div class="tl-transport">${stop.transport}</div>
      <div class="tl-desc">${stop.desc}</div>
    </div>
  `;
  item.addEventListener('click', () => {
    document.querySelectorAll('.tl-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    expandMap();
    setTimeout(() => {
      map.flyTo([stop.lat, stop.lng], 16, { duration: 1.2 });
      setTimeout(() => stopMarkers[idx].openPopup(), 600);
    }, 500);
  });
  tl.appendChild(item);
});

// ===== Hotel list (sidebar) =====
const hl = document.getElementById('hotel-list');
hotels.forEach((hotel, idx) => {
  const card = document.createElement('div');
  card.className = 'hotel-card';
  card.innerHTML = `
    <div class="hotel-dot" style="background:${hotel.color};color:${hotel.color}">${hotel.icon}</div>
    <div class="hotel-body">
      <div class="hotel-name">${hotel.name}<span class="hotel-tag">${hotel.tag}</span></div>
      <div class="hotel-info">${hotel.desc}<br>${hotel.addr}</div>
    </div>
  `;
  card.addEventListener('click', () => {
    expandMap();
    setTimeout(() => {
      map.flyTo([hotel.lat, hotel.lng], 17, { duration: 1.2 });
      setTimeout(() => hotelMarkers[idx].openPopup(), 600);
    }, 500);
  });
  hl.appendChild(card);
});

// ===== Map expand / collapse =====
const mapWrap = document.getElementById('mapWrap');
const mapClose = document.getElementById('mapClose');
const mapOnboard = document.getElementById('mapOnboard');
const onboardClose = document.getElementById('onboardClose');
let isExpanded = false;

function expandMap() {
  if (isExpanded) return;
  isExpanded = true;
  mapWrap.classList.add('expanded');
  setTimeout(() => map.invalidateSize(), 100);
  setTimeout(() => map.invalidateSize(), 500);
}

function collapseMap() {
  isExpanded = false;
  mapWrap.classList.remove('expanded');
  setTimeout(() => map.invalidateSize(), 100);
  setTimeout(() => map.invalidateSize(), 500);
}

// Close onboarding overlay (via X button or clicking anywhere on overlay)
onboardClose.addEventListener('click', (e) => {
  e.stopPropagation();
  mapOnboard.classList.add('hidden');
});

// Click on overlay background (not the card) = close overlay + expand map directly
mapOnboard.addEventListener('click', (e) => {
  if (e.target === mapOnboard) {
    mapOnboard.classList.add('hidden');
    expandMap();
  }
});

// Click map area to expand (after onboarding is closed)
mapWrap.addEventListener('click', (e) => {
  if (isExpanded) return;
  if (e.target.closest('.leaflet-marker-icon') || e.target.closest('.leaflet-popup')) return;
  if (!mapOnboard.classList.contains('hidden')) {
    mapOnboard.classList.add('hidden');
    expandMap();
    return;
  }
  expandMap();
});

mapClose.addEventListener('click', (e) => {
  e.stopPropagation();
  collapseMap();
});
</script>
</body>
</html>
